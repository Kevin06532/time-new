<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态渐变时间日期-定位版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(45deg, #9333EA, #3B82F6, #EC4899);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            position: relative;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .time-date-container {
            text-align: center;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            padding: 2rem 4rem;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            background-color: rgba(255,255,255,0.1);
        }
        #date {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        #time {
            font-size: 4rem;
            font-weight: bold;
        }
        #weather {
            font-size: 3.5rem;
            margin: 20px 0;
            font-weight: bold;
        }
        .info {
            font-size: 1.5rem;
            line-height: 1.8;
        }
        /* 右下角定位城市 */
        .city {
            position: fixed;
            bottom: 20px;
            right: 30px;
            color: rgba(255,255,255,0.35);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="time-date-container">
        <div id="date"></div>
        <div id="time"></div>
        <div id="weather"></div>
        <div class="info">
            <div id="sun"></div>
            <div id="moon"></div>
        </div>
    </div>
    <!-- 右下角实时定位城市 -->
    <div class="city" id="locationCity">获取位置中...</div>

    <script>
        // 1. 强制自动全屏（兼容Chrome/Safari/Edge）
        function enterFullScreen() {
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) docEl.requestFullscreen();
            else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
            else if (docEl.msRequestFullscreen) docEl.msRequestFullscreen();
        }
        window.addEventListener('load', enterFullScreen);

        const $date = document.getElementById('date');
        const $time = document.getElementById('time');
        const $weather = document.getElementById('weather');
        const $sun = document.getElementById('sun');
        const $moon = document.getElementById('moon');
        const $locationCity = document.getElementById('locationCity');
        const weekArr = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

        // 2. 实时获取当前定位城市（深圳/香港自动切换）
        function getLocationCity() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    // 简易区域判断
                    if (lat >=22.4 && lat <=22.55 && lng >=114.1 && lng <=114.3) {
                        $locationCity.textContent = "香港";
                    } else if (lat >=22.5 && lat <=22.7 && lng >=113.8 && lng <=114.1) {
                        $locationCity.textContent = "深圳";
                    } else {
                        $locationCity.textContent = "未知地区";
                    }
                }, () => {
                    $locationCity.textContent = "定位失败";
                });
            } else {
                $locationCity.textContent = "不支持定位";
            }
        }

        // 3. 统一每分钟刷新全部内容
        function updateAll() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth()+1).padStart(2,'0');
            const d = String(now.getDate()).padStart(2,'0');
            const w = weekArr[now.getDay()];
            $date.textContent = `${y}年${m}月${d}日 ${w}`;

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            $time.textContent = `${hours}:${minutes}:${seconds}`;

            $weather.textContent = "晴天 26℃";
            $sun.textContent = "日出：05:55 ｜ 日落：19:05";
            $moon.textContent = "月出：21:10 ｜ 月落：08:20";
            getLocationCity(); // 同步刷新定位
        }

        // 首次加载执行
        updateAll();
        // 60000ms = 1分钟刷新一次
        setInterval(updateAll, 60000);
    </script>
</body>
</html>
