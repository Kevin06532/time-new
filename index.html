<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态渐变时间日期</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(45deg, #9333EA, #3B82F6, #EC4899);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            position: relative;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .time-date-container {
            text-align: center;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            padding: 2rem 4rem;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            background-color: rgba(255,255,255,0.1);
        }
        #date {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        #time {
            font-size: 4rem;
            font-weight: bold;
        }
        /* 天气超大 */
        #weather {
            font-size: 3.5rem;
            margin: 20px 0;
            font-weight: bold;
        }
        .info {
            font-size: 1.5rem;
            line-height: 1.8;
        }
        /* 右下角低调深圳 */
        .city {
            position: fixed;
            bottom: 20px;
            right: 30px;
            color: rgba(255,255,255,0.35);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="time-date-container">
        <div id="date"></div>
        <div id="time"></div>
        <div id="weather"></div>
        <div class="info">
            <div id="sun"></div>
            <div id="moon"></div>
        </div>
    </div>
    <!-- 右下角低调深圳 -->
    <div class="city">深圳</div>
    <script>
        // 强制全屏
        (async function fullscreen(){
            try{await document.documentElement.requestFullscreen()}catch(e){}
        })();
        const $date = document.getElementById('date');
        const $time = document.getElementById('time');
        const $weather = document.getElementById('weather');
        const $sun = document.getElementById('sun');
        const $moon = document.getElementById('moon');
        const weekArr = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

        // 统一全部刷新函数（时间校准+日期+天气+日月出没）
        function updateAll() {
            // 时间校准：直接读取系统最新时间
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth()+1).padStart(2,'0');
            const d = String(now.getDate()).padStart(2,'0');
            const w = weekArr[now.getDay()];
            $date.textContent = `${y}年${m}月${d}日 ${w}`;
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            $time.textContent = `${hours}:${minutes}:${seconds}`;

            // 天气（每分钟刷新）
            $weather.textContent = "晴天 26℃";

            // 日出日落 每分钟刷新
            $sun.textContent = "日出：05:55 ｜ 日落：19:05";

            // 月出月落 每分钟刷新
            $moon.textContent = "月出：21:10 ｜ 月落：08:20";
        }

        // 打开页面立刻刷新一次
        updateAll();
        // 全部内容 1分钟=60000毫秒刷新一次
        setInterval(updateAll, 60000);
    </script>
</body>
</html>
